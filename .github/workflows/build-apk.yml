name: Compilar APK Android Nativo (W800i Launcher)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceptar licencias Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36" || true
          fi

      - name: Instalar dependencias y compilar web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Preparar proyecto Android Nativo con Capacitor
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then
            npx --yes cap add android
          fi
          mkdir -p android/app/src/main/java/com/walkman/w800i android/app/src/main/res/xml
          cp -f android-native/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -f android-native/app/src/main/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp -f android-native/app/src/main/java/com/walkman/w800i/*.java android/app/src/main/java/com/walkman/w800i/
          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let g = fs.readFileSync(p, "utf8");
            const buildNum = process.env.BUILD_NUM || "1";
            g = g.replace(/versionCode\s+\d+/, "versionCode " + buildNum);
            g = g.replace(/versionName\s+"[^"]*"/, "versionName \"2.5." + buildNum + "\"");
            if (!g.includes("androidx.core:core:")) {
              g = g.replace(
                /implementation "androidx\.appcompat:appcompat:\$androidxAppCompatVersion"/,
                "implementation \"androidx.appcompat:appcompat:$androidxAppCompatVersion\"\n    implementation \"androidx.core:core:$androidxCoreVersion\"\n    implementation \"androidx.activity:activity:$androidxActivityVersion\""
              );
            }
            if (!g.includes("compileOptions")) {
              g = g.replace(
                /buildTypes\s*\{/,
                "compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n    }\n    buildTypes {"
              );
            }
            fs.writeFileSync(p, g);
          '
          npx --yes cap sync android
        env:
          BUILD_NUM: ${{ github.run_number }}

      - name: Compilar APK Debug Nativo
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK para distribucion
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk w800i-walkman-launcher.apk

      - name: Subir APK descargable en Actions
        uses: actions/upload-artifact@v4
        with:
          name: w800i-walkman-launcher-apk
          path: w800i-walkman-launcher.apk

      - name: Publicar Release en GitHub para instalar y actualizar desde la app
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_NUM="${{ github.run_number }}"
          NOTES="APK Nativo W800i Walkman Launcher v2.5.${BUILD_NUM} (${SHORT_SHA}) — Launcher predeterminado + iconos reales + auto-actualización."
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" w800i-walkman-launcher.apk --clobber
            gh release edit "${TAG_NAME}" --title "W800i Walkman v2.5.${BUILD_NUM}" --notes "${NOTES}"
          else
            gh release create "${TAG_NAME}" w800i-walkman-launcher.apk \
              --target "${{ github.sha }}" \
              --title "W800i Walkman v2.5.${BUILD_NUM}" \
              --notes "${NOTES}"
          fi
